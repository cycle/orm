---

name: build

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - 2.x
  pull_request: null

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testo:
    name: Testo
    uses: cycle/gh-actions/.github/workflows/testo.yml@master
    with:
      coverage: true
    secrets: inherit

...
