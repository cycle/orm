on:
    pull_request: null
    push:
        branches:
            - master
            - '*.*'

name: static analysis

jobs:
    psalm:
        uses: spiral/gh-actions/.github/workflows/psalm.yml@master
        with:
            os: >-
                ['ubuntu-latest']
            php: '["8.4"]'
            bin-tool: psalm
            command: composer psalm:ci
